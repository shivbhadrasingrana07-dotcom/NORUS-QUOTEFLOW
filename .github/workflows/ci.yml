name: CI Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: quoteflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quoteflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: ci_test_password
      SQL_DB_NAME: quoteflow_test
      SQL_SSL: 'false'
      TEST_SQL_HOST: 127.0.0.1
      TEST_SQL_PORT: 5432
      TEST_SQL_USER: postgres
      TEST_SQL_PASSWORD: ci_test_password
      TEST_SQL_DB_NAME: quoteflow_test
      TEST_SQL_SSL: 'false'
      SESSION_SECRET: ci-test-session-secret-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (strict lockfile validation)
        run: npm ci

      - name: Apply, rollback, and re-apply PostgreSQL migrations
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0000_illegal_major_mapleleaf.sql
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0001_tenant_integrity_preflight.sql
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0001_tenant_integrity.sql
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0001_tenant_integrity_rollback.sql
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0001_tenant_integrity.sql

      - name: TypeScript check
        run: npm run lint

      - name: Run unit, demo, and PostgreSQL integration/concurrency tests
        run: npm test

      - name: Production frontend build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: verify

    env:
      NODE_ENV: development
      DEMO_MODE: 'true'
      DISABLE_HMR: 'true'
      PORT: '3000'
      SESSION_SECRET: ci-e2e-demo-session-secret-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium for headless browser E2E
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run isolated DEMO_MODE browser E2E workflow
        run: |
          npx tsx server.ts > /tmp/norus-e2e-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Demo server process exited unexpectedly before healthcheck."
              cat /tmp/norus-e2e-server.log || true
              exit 1
            fi
            if curl -sf --max-time 5 http://127.0.0.1:3000/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for DEMO_MODE server healthcheck."
            cat /tmp/norus-e2e-server.log || true
            exit 1
          fi

          curl -fsS --max-time 5 http://127.0.0.1:3000/api/auth/me | grep -q '"demoMode":true'
          node tests/browserE2E.mjs

      - name: Upload E2E server logs on failure
        if: failure()
        run: cat /tmp/norus-e2e-server.log || true
