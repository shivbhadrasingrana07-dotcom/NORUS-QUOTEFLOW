name: CI Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: quoteflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quoteflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: ci_test_password
      SQL_DB_NAME: quoteflow_test
      SQL_SSL: 'false'
      TEST_SQL_HOST: 127.0.0.1
      TEST_SQL_PORT: 5432
      TEST_SQL_USER: postgres
      TEST_SQL_PASSWORD: ci_test_password
      TEST_SQL_DB_NAME: quoteflow_test
      TEST_SQL_SSL: 'false'
      SESSION_SECRET: ci-test-session-secret-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # package.json pins esbuild@^0.25.0 while vite@8.3.x declares optional peer esbuild@^0.27.0||^0.28.0
        run: npm ci --legacy-peer-deps

      - name: Apply PostgreSQL schema and tenant integrity migrations
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0000_illegal_major_mapleleaf.sql
          psql -h 127.0.0.1 -U postgres -d quoteflow_test -v ON_ERROR_STOP=1 -f drizzle/0001_tenant_integrity.sql

      - name: TypeScript check
        run: npm run lint

      - name: Run unit, demo, and PostgreSQL integration tests
        run: npm test

      - name: Production frontend build
        run: npm run build
